<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HdK Match">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><title>HdK Match</title>
<style>
:root{color-scheme:light dark;--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#166534;--warn:#92400e}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d10;--card:#15181d;--text:#f5f7fa;--muted:#a8afb9;--line:#2a2f37;--accent:#f5f7fa;--ok:#86efac;--warn:#fcd34d}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif} button{font:inherit;color:inherit}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:26px;font-weight:850;letter-spacing:-.5px}.sub{font-size:13px;color:var(--muted);margin-top:3px}.season{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:12px;color:var(--muted)}.sectionlabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:15px;margin-bottom:6px}.filters{display:flex;flex-wrap:wrap;gap:8px}.chip{min-height:42px;padding:0 13px;border:1px solid var(--line);background:var(--card);border-radius:12px}.chip.active{background:var(--accent);color:var(--bg);font-weight:750}.next,.card{background:var(--card);border:1px solid var(--line);border-radius:16px}.next{margin-top:16px;padding:13px}.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}.nextline{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-top:5px}.nextmatch{font-weight:800}.nextwhen{font-size:13px;text-align:right;white-space:nowrap}.list{display:grid;gap:9px;margin-top:10px}.card{padding:13px}.meta{display:flex;justify-content:space-between;gap:10px}.tags{font-size:12px;color:var(--muted);line-height:1.45}.when{font-size:14px;font-weight:750;margin-top:3px}.where{font-size:11px;border:1px solid var(--line);border-radius:9px;padding:5px 7px;white-space:nowrap;align-self:flex-start}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:12px;font-size:15px;font-weight:750}.teams .h{text-align:right}.dash{color:var(--muted)}.venue{font-size:12px;color:var(--muted);margin-top:9px}.note{font-size:11px;color:var(--muted);margin-top:7px}.empty,.error,.loading{margin-top:16px;padding:18px;border:1px solid var(--line);border-radius:16px;text-align:center;color:var(--muted);background:var(--card)}.error{color:var(--warn)}details{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;font-size:13px;color:var(--muted)}.statusrow{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:7px 0;border-bottom:1px solid var(--line)}.ok{color:var(--ok)}.bad{color:var(--warn)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.linkbtn{min-height:42px;border:1px solid var(--line);border-radius:11px;background:var(--card);padding:0 12px}.foot{font-size:11px;color:var(--muted);margin-top:18px}@media(max-width:420px){.nextline{display:block}.nextwhen{text-align:left;margin-top:4px}.teams{font-size:14px}.wrap{padding-left:11px;padding-right:11px}}
</style></head><body><main class="wrap">
<div class="top"><div><div class="title">HdK Match</div><div class="sub">Próximos partidos · Andrés y Gastón</div></div><div class="season">26/27</div></div>
<div class="sectionlabel">Jugador</div><div class="filters" id="people"><button class="chip active" data-person="all">Todos</button><button class="chip" data-person="andres">Andrés</button><button class="chip" data-person="gaston">Gastón</button></div>
<div class="sectionlabel">Deporte</div><div class="filters" id="sports"><button class="chip active" data-sport="all">Todos</button><button class="chip" data-sport="ice">🧊 Hielo</button><button class="chip" data-sport="line">🛼 Línea</button></div>
<div class="sectionlabel">Desplazamiento</div><div class="filters" id="place"><button class="chip active" data-place="all">Todos</button><button class="chip" data-place="home">🏠 Casa</button><button class="chip" data-place="away">🚗 Fuera</button></div>
<section id="app"><div class="loading">Cargando próximos partidos…</div></section>
<div class="foot">Fuentes oficiales: RFEDH · FMP · RFEP. Google Calendar se usa solo para torneos y partidos especiales no oficiales.</div>
</main>
<script>
(()=>{const state={person:'all',sport:'all',place:'all',data:null};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const norm=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const isHome=g=>g.place?g.place==='home':g.sport==='ice'?['LA NEVERA','MAJADAHONDA','SH MAJADAHONDA'].some(x=>norm(g.home||'').includes(norm(x))):norm(g.home||'').includes('LAS ROZAS');const dt=g=>new Date(`${g.date}T${g.time||'23:59'}:00`);const finished=g=>{const d=dt(g);g.time?d.setHours(d.getHours()+3):d.setHours(23,59,59,999);return d<Date.now()};const fmt=d=>new Intl.DateTimeFormat('es-ES',{weekday:'short',day:'numeric',month:'short'}).format(new Date(`${d}T12:00:00`));const names=g=>g.players?.length===2?'Andrés + Gastón':'Andrés';const icon=g=>g.sport==='ice'?'🧊':'🛼';const filtered=()=>[...(state.data?.games||[])].filter(g=>!finished(g)&&(state.person==='all'||g.players?.includes(state.person))&&(state.sport==='all'||g.sport===state.sport)&&(state.place==='all'||(state.place==='home'?isHome(g):!isHome(g)))).sort((a,b)=>(a.date+(a.time||'23:59')).localeCompare(b.date+(b.time||'23:59')));
function card(g){const when=g.time?`${fmt(g.date)} · ${g.time}`:`${fmt(g.date)} · Hora pendiente`;const matchup=g.special?`<div class="teams" style="grid-template-columns:1fr"><div style="text-align:center">${esc(g.title||g.competition)}</div></div>`:`<div class="teams"><div class="h">${esc(g.home)}</div><div class="dash">—</div><div>${esc(g.away)}</div></div>`;return `<article class="card"><div class="meta"><div><div class="tags">${icon(g)} ${esc(g.competition)} · ${esc(names(g))}${g.round?` · ${esc(g.round)}`:''}</div><div class="when">${esc(when)}</div></div><div class="where">${isHome(g)?'CASA':'FUERA'}</div></div>${matchup}${g.venue?`<div class="venue">📍 ${esc(g.venue)}</div>`:''}</article>`}
function render(){const app=$('#app');if(!state.data){app.innerHTML='<div class="loading">Cargando próximos partidos…</div>';return}const list=filtered();const next=list[0]?`<section class="next"><div class="eyebrow">Siguiente partido</div><div class="nextline"><div class="nextmatch">${icon(list[0])} ${esc(list[0].special?(list[0].title||list[0].competition):`${list[0].home} — ${list[0].away}`)}</div><div class="nextwhen">${esc(list[0].time?`${fmt(list[0].date)} · ${list[0].time}`:`${fmt(list[0].date)} · Hora pendiente`)}</div></div></section>`:'';const cards=list.length?`<div class="list">${list.map(card).join('')}</div>`:'<div class="empty">No hay próximos partidos con estos filtros.</div>';const updated=state.data.generatedAt?new Intl.DateTimeFormat('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(state.data.generatedAt)):'';const status=(state.data.status||[]).map(s=>`<div class="statusrow"><span>${esc(s.label)}</span><span class="${s.ok&&!s.fallback?'ok':'bad'}">${s.ok?`✓ ${s.games} (${s.upcoming??'?'} futuros)`:'⚠ sin datos oficiales'}</span></div>`).join('');app.innerHTML=`${next}${cards}<details><summary>Fuentes · actualización ${esc(updated)}</summary>${status}<div class="actions"><button class="linkbtn" id="reload">Recargar</button><button class="linkbtn" id="refresh">Actualizar federaciones</button></div></details>`;$('#reload')?.addEventListener('click',load);$('#refresh')?.addEventListener('click',refresh)}
async function load(){try{$('#app').innerHTML='<div class="loading">Cargando próximos partidos…</div>';const r=await fetch('/api/games',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');state.data=d;render()}catch(e){$('#app').innerHTML=`<div class="error">No se pudo cargar HdK Match: ${esc(e.message||e)}</div>`}}
async function refresh(){try{$('#app').innerHTML='<div class="loading">Consultando federaciones…</div>';const r=await fetch('/api/refresh',{method:'POST'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');state.data=d;render()}catch(e){$('#app').innerHTML=`<div class="error">No se pudo actualizar: ${esc(e.message||e)}</div>`}}
function bind(group,key,attr){$$(group+' .chip').forEach(b=>b.addEventListener('click',()=>{state[key]=b.dataset[attr];$$(group+' .chip').forEach(x=>x.classList.toggle('active',x===b));render()}))}
bind('#people','person','person');bind('#sports','sport','sport');bind('#place','place','place');if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load()})();
</script></body></html>
