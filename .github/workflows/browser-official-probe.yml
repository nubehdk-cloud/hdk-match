name: Verify official federations through browser
on:
  push:
    branches: [main]
    paths:
      - 'scripts/browser_official_probe.mjs'
      - '.github/workflows/browser-official-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check browser availability
        run: which google-chrome || which chromium || true
      - name: Install browser control
        run: npm install --no-save --no-package-lock puppeteer-core@24.26.1
      - name: Inspect only official federation portals
        run: node scripts/browser_official_probe.mjs
